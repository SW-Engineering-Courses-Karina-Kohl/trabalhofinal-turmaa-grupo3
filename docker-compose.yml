services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesops
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salesops-net
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "80:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
    depends_on:
      - backend
    networks:
      - salesops-net
    container_name: salesops-frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/target/sales-ops-1.0.war:/opt/jboss/wildfly/standalone/deployments/sales-ops.war  
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - salesops-net
    container_name: salesops-backend

volumes:
  pg_data:

networks:
  salesops-net:
    driver: bridge
