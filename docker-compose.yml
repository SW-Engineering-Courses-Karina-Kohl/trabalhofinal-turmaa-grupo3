services:
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_SERVER_JSON_FILE: /pgadmin/connections.json
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - ./pgadmin:/pgadmin
    env_file: .env
  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: salesops_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - salesops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: salesops-db
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${API_ENDPOINT}
      - VITE_WS_URL=${WS_ENDPOINT}
    depends_on:
      - backend
    networks:
      - salesops-net
    container_name: salesops-frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - salesops-net
    container_name: salesops-backend

volumes:
  pg_data:

networks:
  salesops-net:
    driver: bridge
