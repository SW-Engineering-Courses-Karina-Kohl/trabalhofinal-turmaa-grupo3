services:
  redis:
    image: redis:7-alpine
    networks:
      - salesops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  backend:
    build:
      context: ./pseudobackend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes: 
      - "./pseudobackend:/rails"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salesops-net
