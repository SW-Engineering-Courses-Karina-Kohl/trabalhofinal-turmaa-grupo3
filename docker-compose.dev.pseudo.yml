services:
  redis:
    image: redis:7-alpine
    networks:
      - salesops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger-ui
    volumes:
      - ./${SWAGGER_DOC}:/doc
    environment:
      - SWAGGER_JSON=/doc/swagger.json
    depends_on:
      - backend
    networks:
      - salesops-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swagger.rule=Host(`swagger.localhost`)"
      - "traefik.http.routers.swagger.entrypoints=web"
      - "traefik.http.routers.swagger.service=swagger-service"
      - "traefik.http.services.swagger-service.loadbalancer.server.port=8080"
      
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: salesops_development
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - salesops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: salesops-db
    
  backend:
    build:
      context: ./pseudobackend
      dockerfile: Dockerfile
    volumes: 
      - "./pseudobackend:/rails"
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - salesops-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.service=backend-service"
      - "traefik.http.services.backend-service.loadbalancer.server.port=3000"
