services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: salesops
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - salesops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    container_name: salesops-db
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${API_ENDPOINT}
      - VITE_WS_URL=${WS_ENDPOINT}
    depends_on:
      - backend
    networks:
      - salesops-net
    container_name: salesops-frontend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Hot deploy — drop WARs here and WildFly picks them up automatically
      - ./target/sales-ops-1.0.war:/opt/jboss/wildfly/standalone/deployments/sales-ops.war
    ports:
      - "8080:8080"    
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - salesops-net
    container_name: salesops-backend

volumes:
  pg_data:

networks:
  salesops-net:
    driver: bridge
